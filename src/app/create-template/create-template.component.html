<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <mat-card class="form-card">
                <mat-card-header>
                    <mat-card-title>Create Template</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <form [formGroup]="templateForm" (ngSubmit)="onSave()">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Template Name</mat-label>
                            <input matInput formControlName="name">
                            <mat-error *ngIf="templateForm.get('name')?.hasError('required')">Name is
                                required</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Description</mat-label>
                            <textarea matInput formControlName="description"></textarea>
                            <mat-error *ngIf="templateForm.get('description')?.hasError('required')">Description is
                                required</mat-error>
                        </mat-form-field>

                        <div class="actions">
                            <button mat-button type="button" (click)="onCancel()">Cancel</button>
                            <button mat-raised-button color="primary" type="submit"
                                [disabled]="templateForm.invalid">Save</button>
                        </div>
                    </form>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
